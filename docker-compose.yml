# Vaultly Docker Compose stack, adapted from the official Paperless-ngx
# PostgreSQL + Tika template:
# https://github.com/paperless-ngx/paperless-ngx/blob/main/docker/compose/docker-compose.postgres-tika.yml

services:
  broker:
    image: docker.io/library/redis:8.8.0
    restart: unless-stopped
    volumes:
      - redisdata:/data

  db:
    image: docker.io/library/postgres:18.4
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${PAPERLESS_DBNAME}
      POSTGRES_USER: ${PAPERLESS_DBUSER}
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS}

  webserver:
    build:
      context: .
      dockerfile: Dockerfile.vaultly
    image: vaultly-paperless:2.20.15-frontend3
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - "${PAPERLESS_PORT:-8000}:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./branding/vaultly-logo.svg:/usr/src/paperless/static/vaultly-logo.svg:ro
      - ./branding/vaultly-favicon.svg:/usr/src/paperless/static/vaultly-favicon.svg:ro
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    env_file:
      - .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.25
    restart: unless-stopped
    # Paperless uses the Chromium route for email conversion. Blocking external
    # content prevents tracking pixels and JavaScript from being loaded.
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*

  tika:
    image: docker.io/apache/tika:3.2.3.0
    restart: unless-stopped

volumes:
  data:
  media:
  pgdata:
  redisdata:
